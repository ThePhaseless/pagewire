# Avahi for the printscan device pod: the pod's only mDNS responder.
# Started as the avahi user with --no-drop-root --no-chroot --no-rlimits.
# ipp-usb, AirSane and ippeveprinter publish through it over D-Bus; the
# agent browses through it.
# Give the container a private writable /run (with /run/dbus mounted inside
# it): avahi-daemon mkdirs /run/avahi-daemon itself and refuses to start
# unless that directory is owned by avahi:avahi, which a root-owned volume
# mounted straight at /run/avahi-daemon never is.

[server]
use-ipv4=yes
use-ipv6=yes
enable-dbus=yes
ratelimit-interval-usec=1000000
ratelimit-burst=1000

[wide-area]
enable-wide-area=yes

[publish]
publish-workstation=no

[reflector]

[rlimits]
