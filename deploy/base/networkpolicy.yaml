apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: printscan
  namespace: printing
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: printscan
  policyTypes: [Ingress]
  ingress:
    # Web UI and API from the ingress controller's namespace only.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - port: 8080
          protocol: TCP
    # Agent reports. The agent runs in the hostNetwork device pod, so its traffic does
    # not come from a pod IP that a podSelector could match. Depending on the CNI it
    # arrives with the node's LAN address (192.168.1.0/24 here) or with the node's
    # address inside the pod network (example pod CIDR 10.244.0.0/16). Both are listed;
    # check which one your CNI uses and drop the other.
    - from:
        - ipBlock:
            cidr: 192.168.1.0/24
        - ipBlock:
            cidr: 10.244.0.0/16
      ports:
        - port: 8081
          protocol: TCP
