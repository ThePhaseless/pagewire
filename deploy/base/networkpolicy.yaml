apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pagewire
  namespace: printing
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: pagewire
  policyTypes: [Ingress]
  ingress:
    # Web UI and API from the ingress controller's namespace only. Set the name of
    # the namespace your ingress controller runs in.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-controller  # CHANGE ME
      ports:
        - port: 8080
          protocol: TCP
    # Agent reports. The agent runs in the hostNetwork device pod, so its traffic does
    # not come from a pod IP that a podSelector could match. Depending on the CNI it
    # arrives with the node's LAN address or with the node's address inside the pod
    # network (example pod CIDR 10.244.0.0/16). Both are listed; check which one your
    # CNI uses and drop the other. 192.0.2.0/24 is a documentation range that matches
    # nothing: replace it with your nodes' LAN subnet, or narrow it to the address of
    # every node with USB devices, one /32 each (each such node runs a device pod).
    - from:
        - ipBlock:
            cidr: 192.0.2.0/24  # CHANGE ME
        - ipBlock:
            cidr: 10.244.0.0/16
      ports:
        - port: 8081
          protocol: TCP
