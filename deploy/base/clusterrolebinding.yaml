apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pagewire-nodes
# Optional, with clusterrole.yaml: needed only for devices on more than one node.
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pagewire-nodes
subjects:
  - kind: ServiceAccount
    name: pagewire
    namespace: printing
