apiVersion: apps/v1
kind: Deployment
metadata:
  # PAGEWIRE_K8S_OWNER below must name this Deployment: it owns the device pod.
  name: pagewire
  namespace: printing
  annotations:
    # pagewire watches its config file itself; a restart is never needed.
    reloader.stakater.com/auto: "false"
spec:
  replicas: 1
  strategy:
    type: Recreate # the data volume is ReadWriteOnce
  selector:
    matchLabels:
      app.kubernetes.io/name: pagewire
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pagewire
    spec:
      serviceAccountName: pagewire
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        # The name is load-bearing: the control plane reads the image of the container
        # named "pagewire" in this Deployment and runs the device pod's probe, agent
        # and fetch-blobs containers from it. Renaming it falls back to a registry tag.
        - name: pagewire
          # Use main until the first release, then a version tag pinned by digest
          # (<version>@sha256:<digest>); kustomization.yaml sets the same tag.
          image: ghcr.io/thephaseless/pagewire:main
          # main moves with every push, and the device pod already pulls it Always, so
          # both run the same agent protocol. Drop this once the image is pinned as
          # <version>@sha256:<digest>.
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
            - name: internal
              containerPort: 8081
          env:
            # Must equal <generic-device-plugin --domain>/<device name>, see
            # deploy/examples/generic-device-plugin.yaml. Empty disables USB (simulated only).
            - name: PAGEWIRE_USB_RESOURCE
              value: devic.es/printer
            - name: PAGEWIRE_K8S_OWNER
              value: pagewire
            - name: TZ
              value: Etc/UTC
            # No GOMEMLIMIT: pagewire sets the Go memory limit to 80% of
            # resources.limits.memory, read from the cgroup. Setting GOMEMLIMIT overrides that.
            # Host names the UI and API answer to, comma-separated; other Host headers
            # get 421. Unset or empty: no check on Kubernetes. "*" turns the check off.
            # - name: PAGEWIRE_ALLOWED_HOSTS
            #   value: pagewire.example.com
            # Shared secret the auth proxy adds to every request. When set, /api/ requests
            # without the header get 401. Create the Secret yourself.
            # - name: PAGEWIRE_PROXY_SECRET
            #   valueFrom:
            #     secretKeyRef:
            #       name: pagewire-proxy-secret
            #       key: secret
            # Header that carries it; this is the default.
            # - name: PAGEWIRE_PROXY_SECRET_HEADER
            #   value: X-Pagewire-Proxy-Secret
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pagewire-data
        - name: tmp
          emptyDir: {}
