apiVersion: v1
kind: Service
metadata:
  name: printscan
  namespace: printing
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: printscan
  ports:
    # Web UI and API; put this behind the ingress and an auth proxy.
    - name: http
      port: 8080
      targetPort: http
    # Agent reports from the device pod only; never route the ingress here.
    - name: internal
      port: 8081
      targetPort: internal
