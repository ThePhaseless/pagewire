apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pagewire-nodes
# Optional: needed only for USB printers and scanners on more than one node.
# pagewire lists the nodes to find those whose allocatable PAGEWIRE_USB_RESOURCE is
# above 0, and runs one device workload pinned to each. Without this ClusterRole
# (and its binding) the list is refused and pagewire runs one unpinned device
# workload, pagewire-device, as before. Nodes are cluster-scoped, so the rule cannot
# be narrowed by resourceNames; it grants list only.
# internal/backend/k8s/policy_test.go checks every client call against this file.
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [list]
