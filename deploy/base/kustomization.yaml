apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: printing
labels:
  - pairs:
      app.kubernetes.io/name: printscan
    includeSelectors: true
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - role.yaml
  - rolebinding.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - networkpolicy.yaml
images:
  # Use main until the first release, then pin <version>@sha256:<digest>
  # (and drop imagePullPolicy: Always in deployment.yaml).
  # The device pod's probe, agent and fetch-blobs containers reuse this exact image string.
  - name: ghcr.io/thephaseless/printscan
    newTag: main
