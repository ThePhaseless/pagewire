apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: printing
labels:
  - pairs:
      app.kubernetes.io/name: printscan
    includeSelectors: true
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - role.yaml
  - rolebinding.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - networkpolicy.yaml
images:
  # Example tag only: real deployments pin tag@digest (newTag: 1.2.3@sha256:<digest>).
  # The device pod's probe, agent and fetch-blobs containers reuse this exact image string.
  - name: ghcr.io/thephaseless/printscan
    newTag: 0.0.0
