apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: printing
labels:
  - pairs:
      app.kubernetes.io/name: pagewire
    includeSelectors: true
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - role.yaml
  - rolebinding.yaml
  # Optional: only for USB devices on more than one node; remove both to run one
  # device workload.
  - clusterrole.yaml
  - clusterrolebinding.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - networkpolicy.yaml
images:
  # Use main until the first release, then pin <version>@sha256:<digest>
  # (and drop imagePullPolicy: Always in deployment.yaml).
  # The device pod's probe, agent and fetch-blobs containers reuse this exact image string.
  - name: ghcr.io/thephaseless/pagewire
    newTag: main
