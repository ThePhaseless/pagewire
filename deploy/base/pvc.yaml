# Both claims are ReadWriteOnce: the config watcher relies on inotify, which only sees
# changes on a volume mounted from a single node (network RWX file systems miss them).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: printscan-data
  namespace: printing
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
# Vendor blobs (for example the HP plug-in). Mounted by the device pod that printscan
# renders (fetch-blobs read-write, the driver and scanner containers read-only), not by
# the control plane; the name is the --blob-pvc default.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: printscan-blobs
  namespace: printing
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
