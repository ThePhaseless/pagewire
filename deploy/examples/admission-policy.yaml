# Optional. The printing namespace runs at the privileged Pod Security level because
# the device pod needs hostNetwork. This policy takes back the rest: pods in that
# namespace may use hostNetwork, but not privileged containers, hostPath volumes,
# hostPID, hostIPC, added capabilities or allowPrivilegeEscalation: true. It covers
# containers, initContainers and ephemeralContainers.
# Needs Kubernetes 1.30 or later. Apply it with kubectl apply -f; it is not part of
# deploy/base because it is cluster-scoped.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: printscan-host-network-only
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods, pods/ephemeralcontainers]
  variables:
    - name: containers
      expression: object.spec.containers
    - name: initContainers
      expression: "has(object.spec.initContainers) ? object.spec.initContainers : []"
    - name: ephemeralContainers
      expression: "has(object.spec.ephemeralContainers) ? object.spec.ephemeralContainers : []"
  validations:
    - expression: "!has(object.spec.hostPID) || !object.spec.hostPID"
      message: hostPID is not allowed
    - expression: "!has(object.spec.hostIPC) || !object.spec.hostIPC"
      message: hostIPC is not allowed
    - expression: "!has(object.spec.volumes) || object.spec.volumes.all(v, !has(v.hostPath))"
      message: hostPath volumes are not allowed
    - expression: >-
        variables.containers.all(c, !has(c.securityContext) || !has(c.securityContext.privileged) || !c.securityContext.privileged) &&
        variables.initContainers.all(c, !has(c.securityContext) || !has(c.securityContext.privileged) || !c.securityContext.privileged) &&
        variables.ephemeralContainers.all(c, !has(c.securityContext) || !has(c.securityContext.privileged) || !c.securityContext.privileged)
      message: privileged containers are not allowed
    - expression: >-
        variables.containers.all(c, !has(c.securityContext) || !has(c.securityContext.allowPrivilegeEscalation) || !c.securityContext.allowPrivilegeEscalation) &&
        variables.initContainers.all(c, !has(c.securityContext) || !has(c.securityContext.allowPrivilegeEscalation) || !c.securityContext.allowPrivilegeEscalation) &&
        variables.ephemeralContainers.all(c, !has(c.securityContext) || !has(c.securityContext.allowPrivilegeEscalation) || !c.securityContext.allowPrivilegeEscalation)
      message: allowPrivilegeEscalation must not be true
    - expression: >-
        variables.containers.all(c, !has(c.securityContext) || !has(c.securityContext.capabilities) || !has(c.securityContext.capabilities.add) || size(c.securityContext.capabilities.add) == 0) &&
        variables.initContainers.all(c, !has(c.securityContext) || !has(c.securityContext.capabilities) || !has(c.securityContext.capabilities.add) || size(c.securityContext.capabilities.add) == 0) &&
        variables.ephemeralContainers.all(c, !has(c.securityContext) || !has(c.securityContext.capabilities) || !has(c.securityContext.capabilities.add) || size(c.securityContext.capabilities.add) == 0)
      message: added capabilities are not allowed
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: printscan-host-network-only
spec:
  policyName: printscan-host-network-only
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: printing
