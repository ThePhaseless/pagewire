# Example: squat/generic-device-plugin exposing the USB printers and scanners as the
# extended resource devic.es/printer, which pagewire's PAGEWIRE_USB_RESOURCE names.
# Based on the upstream manifest at release 0.2.0.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: generic-device-plugin
  namespace: kube-system
  labels:
    app.kubernetes.io/name: generic-device-plugin
  annotations:
    ignore-check.kube-linter.io/privileged-container: "The plugin must be privileged to discover and hand out the host's USB device nodes."
    ignore-check.kube-linter.io/privilege-escalation-container: "Implied by privileged, which the plugin needs for host device access."
    ignore-check.kube-linter.io/run-as-non-root: "The plugin runs as root to read /dev and register with the kubelet's device-plugin socket."
    ignore-check.kube-linter.io/sensitive-host-mounts: "The plugin scans the host's /dev for the USB devices it exposes."
    ignore-check.kube-linter.io/no-read-only-root-fs: "Kept as the upstream 0.2.0 manifest runs it; not verified with a read-only root file system."
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: generic-device-plugin
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: generic-device-plugin
    spec:
      priorityClassName: system-node-critical
      tolerations:
        - operator: Exists
          effect: NoExecute
        - operator: Exists
          effect: NoSchedule
      containers:
        - name: generic-device-plugin
          image: squat/generic-device-plugin:0.2.0@sha256:66c8d5c270eb2b721f1064c549b9b7898152a6d2f0163380a5d37dc7636c20ff
          args:
            # The resource name is <domain>/<device name>. 0.2.0 changed the default
            # domain from squat.ai to devic.es; it is passed explicitly so the name stays
            # devic.es/printer on any version. It must match PAGEWIRE_USB_RESOURCE.
            - --domain=devic.es
            # One group lists every USB printer and scanner pagewire may use; replace
            # VVVV:PPPP and WWWW:QQQQ with their USB vendor and product IDs (4 lowercase
            # hex digits, as lsusb shows them), one "usb" entry each, and add "serial"
            # to pick one unit. On each node where at least one entry matches, the
            # group advertises "count" units of devic.es/printer, and every unit
            # carries all of that node's matched devices (entries that match nothing
            # there are skipped). So the resource cannot pick one device among several,
            # but it does pick the node: nodes without a match advertise 0, and
            # pagewire runs one device pod on each node that advertises more.
            # Every USB container of that pod requests one unit: the probe, ipp-usb,
            # up to five printer applications and AirSane, so count 8 always suffices.
            # The probe pod pagewire runs before anything is configured requests one
            # too, so with no device plugged in that pod stays Pending.
            # A device listed here is visible to ipp-usb and AirSane in the device pod
            # even when pagewire is told not to use it: leave such devices out.
            - '--device={"name":"printer","groups":[{"count":8,"usb":[{"vendor":"VVVV","product":"PPPP"},{"vendor":"WWWW","product":"QQQQ"}]}]}'
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 10Mi
            limits:
              cpu: 50m
              memory: 20Mi
          securityContext:
            privileged: true
          volumeMounts:
            - name: device-plugin
              mountPath: /var/lib/kubelet/device-plugins
            - name: dev
              mountPath: /dev
      volumes:
        - name: device-plugin
          hostPath:
            path: /var/lib/kubelet/device-plugins
        - name: dev
          hostPath:
            path: /dev
