version: "2"

run:
  # Lint test/integration too; CI runs one golangci-lint step.
  build-tags:
    - integration
    - docker

linters:
  default: standard
  enable:
    - bodyclose
    - depguard
    - errorlint
    - forbidigo
    - gosec
    - misspell
    - noctx
  settings:
    depguard:
      rules:
        no-exec:
          list-mode: lax
          files:
            - $all
          deny:
            - pkg: os/exec
              desc: "pagewire never runs commands: use IPP, eSCL, D-Bus, the Kubernetes API or the Docker Engine API"
            - pkg: golang.org/x/sys/execabs
              desc: "pagewire never runs commands: use IPP, eSCL, D-Bus, the Kubernetes API or the Docker Engine API"
    forbidigo:
      forbid:
        - pattern: ^(os|syscall)\.StartProcess$
          msg: "pagewire never runs commands: use IPP, eSCL, D-Bus, the Kubernetes API or the Docker Engine API"
        - pattern: ^(syscall|unix)\.(Exec|ForkExec)$
          msg: "pagewire never runs commands: use IPP, eSCL, D-Bus, the Kubernetes API or the Docker Engine API"
        - pattern: ^(syscall|unix)\.SYS_EXECVE(AT)?$
          msg: "pagewire never runs commands: use IPP, eSCL, D-Bus, the Kubernetes API or the Docker Engine API"
      analyze-types: true
  exclusions:
    paths:
      - ui/node_modules

formatters:
  enable:
    - gofumpt
  exclusions:
    paths:
      - ui/node_modules
