# yaml-language-server: $schema=https://raw.githubusercontent.com/ThePhaseless/pagewire/main/schema/config.schema.json
#
# pagewire config with every key. Only apiVersion and name are required;
# every other key has the default shown unless noted.
apiVersion: pagewire/v1          # required, always pagewire/v1

# Required, 1 to 63 characters, no control characters. UI title, and the queue
# and DNS-SD name of PAPPL and simulated printers. ipp-usb and AirSane advertise
# the device's own names.
name: Living room printer

location: Living room             # printer-location, 0 to 127 characters (default "")

device:
  mode: usb                       # usb | simulated (test printer and SANE test scanner, no USB resource)
  usb:                            # optional selector when several USB devices are visible; only with mode usb (default: none)
    vendorId: "03f0"              # 4 lowercase hex digits
    productId: "2754"             # 4 lowercase hex digits (03f0:2754 is the sim's default device)
    serial: ""                    # optional
  driver: auto                    # auto | ipp-usb | ps | hplip | gutenprint | ghostscript
  scanner: auto                   # auto | ipp-usb | airsane | none

print:
  defaults:
    media: iso_a4_210x297mm       # PWG self-describing media name, e.g. na_letter_8.5x11in
    sides: one-sided              # one-sided | two-sided-long-edge | two-sided-short-edge
    colorMode: auto               # auto | color | monochrome
    quality: normal               # draft | normal | high
  maxUploadMiB: 50                # 1 to 500

scan:
  defaults:
    source: platen                # platen | adf | adf-duplex
    resolution: 300               # 75 to 1200
    colorMode: color              # color | grayscale | blackandwhite
    format: pdf                   # pdf | jpeg
  retentionDays: 7                # 0 (keep forever) to 3650

licenses:
  # Vendor licences you accepted (default []). Accept them in the wizard or in
  # Settings, which show the vendor's own licence text and record its sha256.
  # Each {id, version} must exist in the catalog and appear once. The blob is
  # installed only while the vendor's text still has the recorded sha256.
  acceptedEulas: []
  # acceptedEulas:
  #   - id: hplip-plugin
  #     version: "3.24.4"
  #     textSha256: <sha256 of the licence text, shown in Settings>
