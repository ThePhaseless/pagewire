# Real hardware on one Docker or rootful Podman host. The control plane creates
# the device containers (dbus, avahi, ipp-usb, driver, AirSane, agent) through
# the Engine API. See README "Deploying with Docker or Podman".
name: pagewire-docker # apart from the demo stack in compose.yaml
services:
  pagewire:
    image: ${PAGEWIRE_IMAGE:-ghcr.io/thephaseless/pagewire:main}
    # --docker-container: the probe, agent and fetch-blobs run this container's image.
    container_name: pagewire
    command: ["serve", "--backend=docker"]
    network_mode: host
    userns_mode: host
    environment:
      PAGEWIRE_LISTEN: ${PAGEWIRE_LISTEN:-127.0.0.1:8080}
      PAGEWIRE_INTERNAL_LISTEN: ${PAGEWIRE_INTERNAL_LISTEN:-127.0.0.1:8081}
      PAGEWIRE_IMAGE_OVERRIDES: ${PAGEWIRE_IMAGE_OVERRIDES:-}
      PAGEWIRE_HOST_IP: ${PAGEWIRE_HOST_IP:-}
      # Empty: localhost, 127.0.0.1, [::1] and the host IP.
      PAGEWIRE_ALLOWED_HOSTS: ${PAGEWIRE_ALLOWED_HOSTS:-}
      # Empty: no proxy secret. A secret file must be mounted; the path is inside the container.
      PAGEWIRE_PROXY_SECRET: ${PAGEWIRE_PROXY_SECRET:-}
      PAGEWIRE_PROXY_SECRET_FILE: ${PAGEWIRE_PROXY_SECRET_FILE:-}
      PAGEWIRE_PROXY_SECRET_HEADER: ${PAGEWIRE_PROXY_SECRET_HEADER:-}
      # Inside the container. compose.docker-proxy.yaml points it at the socket proxy.
      DOCKER_HOST: ${PAGEWIRE_DOCKER_HOST:-unix:///var/run/docker.sock}
    # The Engine socket is root:docker (Docker) or root:root (Podman) 0660.
    group_add: ["${DOCKER_GID:?set DOCKER_GID to the socket's group: stat -c %g /var/run/docker.sock}"]
    volumes:
      - data:/data
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock:ro
    tmpfs: [/tmp]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
volumes:
  data:
