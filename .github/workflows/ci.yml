name: CI

on:
  push:
    branches: ["main"]
    tags: ["v*.*.*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

# Only pull requests cancel superseded runs: a pushing run that stopped between pushing
# images and pushing their sources would leave images without corresponding source.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  go:
    # A versioned label, so Renovate offers the next Ubuntu as a PR that CI tests first.
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
      - name: Install the cgo build headers (go-mfp imgconv needs libjpeg and libpng)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libjpeg-turbo8-dev libpng-dev
      - run: go mod verify
      - run: go vet ./...
      # The docker backend's end-to-end test compiles only with both tags; fail here, not in docker-backend.
      - run: go vet -tags integration,docker ./test/integration/...
      - run: golangci-lint run
      - run: go test -race -count=1 ./...
      - run: go run ./cmd/pagewire validate examples/pagewire.yaml examples/simulated.yaml
      - run: go tool go-licenses check ./cmd/pagewire --allowed_licenses=Apache-2.0,BSD-2-Clause,BSD-3-Clause,MIT,ISC,MPL-2.0
      # pagewire never runs commands; these dependencies import os/exec for code paths it does not use
      # (godbus's autolaunch, client-go's exec credential plugin, gnostic's plugin runner).
      - name: Only the known dependencies import os/exec
        run: |
          # shellcheck disable=SC2016 # $p is a Go template variable
          got=$(go list -deps -f '{{if not .Standard}}{{$p := .ImportPath}}{{range .Imports}}{{if eq . "os/exec"}}{{$p}}{{"\n"}}{{end}}{{end}}{{end}}' ./cmd/pagewire | sort -u)
          want='github.com/godbus/dbus/v5
          github.com/google/gnostic-models/compiler
          k8s.io/client-go/plugin/pkg/client/auth/exec'
          diff <(printf '%s\n' "$want") <(printf '%s\n' "$got")
      - run: actionlint
      - name: Validate the example deployment
        run: kustomize build deploy/base | kubeconform -strict -summary -kubernetes-version 1.37.0 -
      - name: Validate the rendered device pod goldens and the deploy examples
        run: kubeconform -strict -summary -kubernetes-version 1.37.0 internal/backend/k8s/testdata/*.golden.yaml deploy/examples/*.yaml
      - run: kube-linter lint deploy/base internal/backend/k8s/testdata

  ui:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
      - run: bun install --frozen-lockfile
      - run: bun run gen
      - name: The generated Zod types match the committed schema
        run: git diff --exit-code src/gen
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
      - run: bun run build
      - name: The build keeps dist/.keep and leaves the tree clean
        run: test -f dist/.keep && test -z "$(git status --porcelain -- .)"

  e2e:
    needs: [go, ui]
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
      - name: Install the cgo build headers (the harness builds the binary)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libjpeg-turbo8-dev libpng-dev
      - run: bun install --frozen-lockfile
      - name: Install Chromium for the browser scenarios
        run: bunx playwright-core install --with-deps chromium-headless-shell
      - run: bun run build
      - run: bun run e2e
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-artifacts
          path: ui/e2e/artifacts
          if-no-files-found: ignore

  # Real daemons under host networking: dbus, avahi, ippeveprinter, AirSane, ps-printer-app and the agent.
  integration:
    needs: go
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
      - name: Install the cgo build headers
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libjpeg-turbo8-dev libpng-dev
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build pagewire:dev
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          tags: pagewire:dev
          load: true
          cache-from: type=gha,scope=integration-pagewire
          cache-to: type=gha,mode=max,scope=integration-pagewire
      # The device and driver Dockerfiles end with a sources stage, so the target is always named.
      - name: Build pagewire-device:dev
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: images/device/Dockerfile
          target: device
          tags: pagewire-device:dev
          load: true
          cache-from: type=gha,scope=integration-pagewire-device
          cache-to: type=gha,mode=max,scope=integration-pagewire-device
      - name: Build pagewire-driver-ps:dev
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: images/driver/Dockerfile
          target: ps
          tags: pagewire-driver-ps:dev
          load: true
          cache-from: type=gha,scope=integration-pagewire-driver-ps
          cache-to: type=gha,mode=max,scope=integration-pagewire-driver-ps
      - name: Free port 5353 for the test's avahi-daemon
        run: |
          if systemctl is-active --quiet avahi-daemon.service avahi-daemon.socket; then
            sudo systemctl stop avahi-daemon.socket avahi-daemon.service
          fi
      - name: Start the daemons
        run: |
          printf %s "$(openssl rand -hex 16)" > test/integration/token
          docker compose -f compose.test.yaml up -d
      - run: go test -tags integration -count=1 ./test/integration/...
      - if: failure()
        run: docker compose -f compose.test.yaml logs --tail=500
      - if: always()
        run: docker compose -f compose.test.yaml down -v

  # The docker backend end to end, without hardware: compose.docker.yaml's control plane creates the
  # simulated-mode device containers through the Engine API of Docker or rootful Podman.
  docker-backend:
    needs: go
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        engine: [docker, podman]
    env:
      # Fully qualified, so Podman does not apply its docker.io short-name rule.
      PAGEWIRE_IMAGE: localhost/pagewire:dev
      PAGEWIRE_IMAGE_OVERRIDES: device=localhost/pagewire-device:dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
      - name: Install the cgo build headers
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libjpeg-turbo8-dev libpng-dev
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Reads the integration job's caches; writing them from two matrix legs would race.
      - name: Build localhost/pagewire:dev
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          tags: localhost/pagewire:dev
          load: true
          cache-from: type=gha,scope=integration-pagewire
      - name: Build localhost/pagewire-device:dev
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: images/device/Dockerfile
          target: device
          tags: localhost/pagewire-device:dev
          load: true
          cache-from: type=gha,scope=integration-pagewire-device
      - name: Free port 5353 for the device's avahi-daemon
        run: |
          if systemctl is-active --quiet avahi-daemon.service avahi-daemon.socket; then
            sudo systemctl stop avahi-daemon.socket avahi-daemon.service
          fi
      - name: Switch to rootful Podman
        if: matrix.engine == 'podman'
        run: |
          command -v podman || (sudo apt-get update && sudo apt-get install -y --no-install-recommends podman)
          sudo systemctl start podman.socket
          docker save localhost/pagewire:dev localhost/pagewire-device:dev | sudo podman load
          # Ephemeral runner: compose and the test reach the root socket without sudo.
          sudo chmod 0755 /run/podman
          sudo chmod 0666 /run/podman/podman.sock
          echo "DOCKER_HOST=unix:///run/podman/podman.sock" >> "$GITHUB_ENV"
          echo "DOCKER_SOCKET=/run/podman/podman.sock" >> "$GITHUB_ENV"
      # No --wait: the test polls /healthz and the status.
      - name: Start the control plane
        run: DOCKER_GID="$(stat -c %g "${DOCKER_SOCKET:-/var/run/docker.sock}")" docker compose -f compose.docker.yaml up -d
      - run: go test -tags integration,docker -count=1 -timeout 20m -run '^TestDockerBackend$' ./test/integration/...
      - if: failure()
        run: |
          DOCKER_GID=0 docker compose -f compose.docker.yaml logs --tail=500
          docker ps -a
          for c in $(docker ps -aq --filter label=io.github.thephaseless.pagewire.managed-by=pagewire); do
            echo "::group::$c"
            docker logs --tail=200 "$c"
            echo "::endgroup::"
          done
      # compose down leaves the device containers: the control plane created them.
      - if: always()
        run: |
          DOCKER_GID=0 docker compose -f compose.docker.yaml down -v
          docker ps -aq --filter label=io.github.thephaseless.pagewire.managed-by=pagewire | xargs -r docker rm -fv
          docker volume ls -q --filter label=io.github.thephaseless.pagewire.managed-by=pagewire | xargs -r docker volume rm

  # The VERSION build arg: the branch or tag name with each run of characters a tag cannot hold
  # replaced by `-`, the shape docker/metadata-action gives type=ref tags. Runs on renovate/**
  # (dispatched by indexes.yml) build without pushing.
  version:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.ref.outputs.version }}
    steps:
      - id: ref
        env:
          REF_NAME: ${{ github.ref_name }}
        run: printf 'version=%s\n' "$(printf '%s' "$REF_NAME" | sed -E 's/[^a-zA-Z0-9._-]+/-/g')" >> "$GITHUB_OUTPUT"

  # Docker's reusable workflow: one native runner per platform, a merged multi-platform manifest,
  # provenance and SBOM attestations signed with the job's OIDC identity. A pull request or a renovate/** run
  # builds without pushing.
  build:
    needs: [go, ui, e2e, integration, docker-backend, version]
    strategy:
      fail-fast: false
      matrix:
        # licenses: the SPDX expression for the image label. The device and driver images hold
        # Ubuntu packages under many licences (see THIRD_PARTY_NOTICES.md), so they say NOASSERTION.
        include:
          - {image: pagewire, file: Dockerfile, target: "", licenses: Apache-2.0}
          - {image: pagewire-device, file: images/device/Dockerfile, target: device, licenses: NOASSERTION}
          - {image: pagewire-driver-ps, file: images/driver/Dockerfile, target: ps, licenses: NOASSERTION}
          - {image: pagewire-driver-hplip, file: images/driver/Dockerfile, target: hplip, licenses: NOASSERTION}
          - {image: pagewire-driver-gutenprint, file: images/driver/Dockerfile, target: gutenprint, licenses: NOASSERTION}
          - {image: pagewire-driver-ghostscript, file: images/driver/Dockerfile, target: ghostscript, licenses: NOASSERTION}
          - {image: pagewire-driver-legacy, file: images/driver/Dockerfile, target: legacy, licenses: NOASSERTION}
    uses: docker/github-builder/.github/workflows/build.yml@bb1eb9fb69408ac52395fb21f49c6b52d564529a # v1.20.0
    permissions:
      contents: read
      id-token: write
      packages: write
    with:
      output: image
      push: ${{ github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/heads/renovate/') }}
      file: ${{ matrix.file }}
      target: ${{ matrix.target }}
      platforms: linux/amd64,linux/arm64
      cache: true
      cache-mode: max
      cache-scope: ${{ matrix.image }}
      sbom: true
      set-meta-labels: true
      meta-labels: org.opencontainers.image.licenses=${{ matrix.licenses }}
      build-args: VERSION=${{ needs.version.outputs.version }}
      meta-images: ghcr.io/thephaseless/${{ matrix.image }}
      # `latest` follows the newest version tag (the action's default flavor).
      # sha-<commit> lets the sources job read back exactly the images this run pushed.
      meta-tags: |
        type=ref,event=branch
        type=ref,event=pr
        type=semver,pattern={{version}}
        type=semver,pattern={{major}}.{{minor}}
        type=semver,pattern={{major}}
        type=sha,format=long
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  # Corresponding source for the GPL/LGPL programs in the device and driver images, for every pushed
  # branch and tag (never pull requests or renovate/** runs, which push no images), as
  # <image>:<branch or version>-sources. The package lists come from the amd64 and arm64
  # images this run pushed (sha-<commit>), so the sources match them. It runs even when one build leg
  # failed: the other images were pushed and need their sources; the failed image's leg fails at its
  # pushed-* stage, and ci-ok fails.
  sources:
    if: ${{ !cancelled() && github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/heads/renovate/') && needs.build.result != 'skipped' }}
    needs: [build, version]
    strategy:
      fail-fast: false
      matrix:
        include:
          - {image: pagewire-device, file: images/device/Dockerfile}
          - {image: pagewire-driver-ps, file: images/driver/Dockerfile}
          - {image: pagewire-driver-hplip, file: images/driver/Dockerfile}
          - {image: pagewire-driver-gutenprint, file: images/driver/Dockerfile}
          - {image: pagewire-driver-ghostscript, file: images/driver/Dockerfile}
          - {image: pagewire-driver-legacy, file: images/driver/Dockerfile}
    uses: docker/github-builder/.github/workflows/build.yml@bb1eb9fb69408ac52395fb21f49c6b52d564529a # v1.20.0
    permissions:
      contents: read
      id-token: write
      packages: write
    with:
      output: image
      push: true
      file: ${{ matrix.file }}
      target: sources
      platforms: linux/amd64
      cache: true
      cache-mode: max
      cache-scope: ${{ matrix.image }}
      sbom: true
      set-meta-labels: true
      meta-labels: org.opencontainers.image.licenses=NOASSERTION
      build-args: |
        VERSION=${{ needs.version.outputs.version }}
        SOURCES_LISTS=pushed
        PUSHED_IMAGE=ghcr.io/thephaseless/${{ matrix.image }}:sha-${{ github.sha }}
      meta-images: ghcr.io/thephaseless/${{ matrix.image }}
      meta-tags: |
        type=ref,event=branch,suffix=-sources
        type=semver,pattern={{version}},suffix=-sources
        type=semver,pattern={{major}}.{{minor}},suffix=-sources
        type=semver,pattern={{major}},suffix=-sources
      # Only the image build moves `latest`.
      meta-flavor: latest=false
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  # The driver and SANE indexes the dispatcher embeds, generated from the images and compared with the
  # committed files. Only ci-ok needs this job, never build: an Ubuntu package update can change a dump
  # with no repo change, and that blocks merges without stopping main or a tag from publishing images.
  indexes:
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Caches are scoped by ref and a run restores its own and the default branch's, so only main
      # pushes write the indexes-* scopes and every other ref restores main's.
      - name: Build the driver index
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: images/driver/Dockerfile
          target: driver-index
          platforms: linux/amd64
          outputs: type=local,dest=out/driver-index
          cache-from: type=gha,scope=indexes-driver
          cache-to: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'type=gha,mode=max,scope=indexes-driver' || '' }}
      # The integration job writes integration-pagewire-device on every ref.
      - name: Build the SANE index
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: images/device/Dockerfile
          target: sane-index
          platforms: linux/amd64
          outputs: type=local,dest=out/sane-index
          cache-from: |
            type=gha,scope=indexes-device
            type=gha,scope=integration-pagewire-device
          cache-to: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'type=gha,mode=max,scope=indexes-device' || '' }}
      # gzip output may change with the Go version, so compare the decompressed content.
      - name: The committed indexes match the images
        run: diff <(gzip -dc internal/catalog/drivers.tsv.gz) <(gzip -dc out/driver-index/drivers.tsv.gz) && diff internal/catalog/sane-usb.tsv out/sane-index/sane-usb.tsv
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: indexes
          path: out/
          if-no-files-found: ignore
      - if: failure()
        run: echo '::error::The committed driver/SANE indexes differ from what the images produce (a changed Dockerfile or an Ubuntu package update). On a renovate/** branch the Indexes workflow regenerates them. Elsewhere, download the indexes artifact or regenerate with the commands in AGENTS.md, and commit internal/catalog/drivers.tsv.gz and internal/catalog/sane-usb.tsv.'

  # The one check a ruleset requires: a skipped job would satisfy a required check of its own,
  # and the build jobs carry runner labels in their names. `sources` is skipped only on pull
  # requests and renovate/** runs, which push nothing.
  ci-ok:
    if: always()
    needs: [go, ui, e2e, integration, docker-backend, indexes, build, sources]
    runs-on: ubuntu-26.04
    steps:
      - run: |
          test "${{ needs.go.result }}" = success
          test "${{ needs.ui.result }}" = success
          test "${{ needs.e2e.result }}" = success
          test "${{ needs.integration.result }}" = success
          test "${{ needs.docker-backend.result }}" = success
          test "${{ needs.indexes.result }}" = success
          test "${{ needs.build.result }}" = success
          case "${{ needs.sources.result }}" in
            success) ;;
            skipped) test "${{ github.event_name }}" = pull_request || test "${{ startsWith(github.ref, 'refs/heads/renovate/') }}" = true ;;
            *) exit 1 ;;
          esac
