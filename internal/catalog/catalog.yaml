# pagewire device catalog: data only. The dispatcher (dispatch.go) derives each
# device's driver from the generated driver index (drivers.tsv.gz) and its SANE
# backends from the generated SANE index (sane-usb.tsv); this file holds no
# vendor rules. catalog_test.go checks that every reference resolves.
apiVersion: pagewire.catalog/v1

printers:
  - {id: ipp-usb, role: ipp-usb}                                       # device image, ipp-usb container
  # deviceSchemes become QueueSpec.Schemes: the preferred CUPS backend when one
  # device is listed by several (hplip: hp: before usb:).
  - {id: ps, image: pagewire-driver-ps, app: ps-printer-app, port: 8001, deviceSchemes: [usb]}
  - {id: hplip, image: pagewire-driver-hplip, app: hplip-printer-app, port: 8002, deviceSchemes: [hp, usb], optionalEulas: [hplip-plugin]}
  - {id: gutenprint, image: pagewire-driver-gutenprint, app: gutenprint-printer-app, port: 8003, deviceSchemes: [usb]}
  - {id: ghostscript, image: pagewire-driver-ghostscript, app: ghostscript-printer-app, port: 8004, deviceSchemes: [usb]}
  - {id: legacy, image: pagewire-driver-legacy, app: legacy-printer-app, port: 8005, deviceSchemes: [usb]}     # classic CUPS drivers
  - {id: sim, role: ippeveprinter, port: 8631}                          # simulated mode only

# airsane and sim are the same AirSane daemon in different modes, so they share
# a port; they never run in the same pod.
scanners:
  - {id: ipp-usb}
  - {id: airsane, port: 8090}
  - {id: sim, port: 8090}                                               # AirSane + SANE "test"

eulas:
  - id: hplip-plugin
    version: "3.24.4"
    vendor: HP
    title: HP Linux Imaging and Printing proprietary plug-in
    # The licence text ships inside HP's .run archive (./license.txt in the
    # payload). The agent downloads and verifies the archive and shows this
    # file before the user accepts; HP's text is never stored in this repo.
    text: {blob: hplip-plugin, path: license.txt}
    summary: Needed by some HP lasers for firmware upload and by some HP scanners.

blobs:
  - id: hplip-plugin
    eula: hplip-plugin
    enabled: true
    url: https://www.openprinting.org/download/printdriver/auxfiles/HP/plugins/hplip-3.24.4-plugin.run
    # keys/hplip.asc: "HPLIP (HP Linux Imaging and Printing) <hplip@hp.com>",
    # dsa1024, fingerprint 4ABA2F66DBD5A95894910E0673D770CDA59047B9. The
    # fingerprint is the GPG_Verification default key in hplip 3.24.4's
    # base/validation.py. The key was fetched from keyserver.ubuntu.com because
    # the keys.openpgp.org copy has its user ID stripped, which go-crypto
    # refuses to parse. HP signs the .run with DSA over SHA-1, so the sha256 of
    # the archive is pinned as well and both checks must pass. Update the sha256
    # together with the version.
    verify:
      pgpSignatureURL: https://www.openprinting.org/download/printdriver/auxfiles/HP/plugins/hplip-3.24.4-plugin.run.asc
      pgpKey: keys/hplip.asc
      sha256: 1f3c6bdd25661a8a2e18153655d6f06f028c1d9c308d69c8ecfd7767a2d0c5aa
    format: hplip-plugin
    maxBytes: 52428800

# Used when the SANE index has no entry for the device. Ubuntu 26.04's libsane1
# ships every backend here except hpaio, which libsane-hpaio ships; the device
# image installs both. Never add net, escl or airscan: AirSane would re-export
# network scanners.
defaultSaneBackends: [hpaio, epson2, epsonds, pixma, genesys, plustek, fujitsu, canon_dr, xerox_mfp, kodakaio]

# When several families list a device's model, the one listed first wins; within
# a family a recommended driver wins, then the name. Every PAPPL family appears
# exactly once.
driverPriority: [hplip, legacy, ps, gutenprint, ghostscript]

# Generic drivers for a device no family lists by model. The first entry with a
# token in the device's IEEE-1284 CMD (exact, case-insensitive) and a matching
# index row wins; mfg and mdl name the generic driver's model in the index.
commandSets:
  - {commands: [POSTSCRIPT, "POSTSCRIPT LEVEL 2", "POSTSCRIPT LEVEL 3", BRSCRIPT, PS], mfg: Generic, mdl: PostScript Printer}
  - {commands: [PCLXL, "PCL XL", PCL6], mfg: Generic, mdl: PCL 6/PCL XL Printer}
  - {commands: [PCL5C], mfg: Generic, mdl: PCL 5c Printer}
  - {commands: [PCL5E, PCL5, PCL], mfg: Generic, mdl: PCL 5e Printer}

# EULAs a family's drivers need, by driver name. hplip-printer-app names every
# driver that needs HP's plug-in "...requires-proprietary-plugin...".
driverEulas:
  - {family: hplip, nameContains: requires-proprietary-plugin, requiredEulas: [hplip-plugin]}
